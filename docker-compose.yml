version: '3.9'

services:
  db:
    # PG 18 to match production (flyio/postgres-flex). Two major versions of skew
    # between test and prod is a class of bug nobody can see until it ships.
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: apex
      POSTGRES_PASSWORD: apex
      POSTGRES_DB: apex
    volumes:
      # PG18's image wants the mount one level up — it puts the cluster in a
      # subdirectory so pg_upgrade --link can work across the mount boundary.
      # Mounting the old .../data path makes 18 refuse to start.
      - pgdata:/var/lib/postgresql
    ports:
      # published so `prisma migrate diff --from-migrations` has a reachable shadow
      # database — without one the documented schema-change procedure cannot run.
      # 55432, not 5432, so it never fights a postgres already on the host.
      - '55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apex']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://apex:apex@db:5432/apex
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EPC_BEARER_TOKEN: ${EPC_BEARER_TOKEN:-}
      NODE_ENV: production
      # Demo data is opt-in on a production build. CI and a demo instance say so;
      # a real deployment leaves it unset and boots with no accounts it did not
      # create. See apps/api/prisma/seed.ts for why the default runs this way.
      SEED_DEMO: ${SEED_DEMO:-}
      PORT: 4100
      # The browser suite logs in on every test from a single IP, so the honest
      # production limits would fail it for the wrong reason. The limiter itself
      # is covered directly by apps/api/test/security.test.ts.
      RATE_LIMIT_PER_MIN: 5000
      AUTH_RATE_LIMIT_PER_MIN: 1000
      WEB_URL: http://web:80
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
    depends_on:
      db:
        condition: service_healthy
    ports:
      - '4100:4100'
    volumes:
      - uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    depends_on:
      - api
    ports:
      - '8080:80'

volumes:
  pgdata:
  uploads:
