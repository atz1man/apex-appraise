services:
  db:
    # PG 18 to match production (flyio/postgres-flex). Two major versions of skew
    # between test and prod is a class of bug nobody can see until it ships.
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: apex
      # Required, exactly like JWT_SECRET, and for a stronger reason: this port is
      # published. A default of "apex" plus a published port is a database open to
      # whoever finds the host.
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}
      POSTGRES_DB: apex
    volumes:
      # PG18's image wants the mount one level up — it puts the cluster in a
      # subdirectory so pg_upgrade --link can work across the mount boundary.
      # Mounting the old .../data path makes 18 refuse to start.
      - pgdata:/var/lib/postgresql
    ports:
      # published so `prisma migrate diff --from-migrations` has a reachable shadow
      # database — without one the documented schema-change procedure cannot run.
      # 55432, not 5432, so it never fights a postgres already on the host.
      #
      # Bound to the loopback address, not to every interface. That reason above
      # is a DEVELOPER's reason, and it is fully served by a port the machine's
      # own tooling can reach; the bare "55432:5432" it replaces also served
      # anyone who could route to the host.
      - '127.0.0.1:55432:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U apex']
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: infra/api.Dockerfile
    environment:
      DATABASE_URL: postgresql://apex:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in the environment}@db:5432/apex
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in the environment}
      # Optional, and deliberately so — see infra/DEPLOY.md. Unset, the key that
      # seals credentials at rest is derived from JWT_SECRET, so an existing
      # deployment is protected on its next deploy instead of failing to boot.
      # Set it and the signing key and the encryption key rotate independently.
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      EPC_BEARER_TOKEN: ${EPC_BEARER_TOKEN:-}
      NODE_ENV: production
      # Demo data is opt-in on a production build. CI and a demo instance say so;
      # a real deployment leaves it unset and boots with no accounts it did not
      # create. See apps/api/prisma/seed.ts for why the default runs this way.
      SEED_DEMO: ${SEED_DEMO:-}
      PORT: 4100
      # These default to the limiter's own production numbers (see num() in
      # apps/api/src/security.ts). They were pinned at 5000/1000 here so the
      # browser suite — which signs in on every test from a single IP — would
      # not trip them, which meant the file people deploy shipped with
      # brute-force protection a hundred times looser than the code intends.
      # The suite sets them in its own environment now; a deployment gets the
      # honest ones.
      RATE_LIMIT_PER_MIN: ${RATE_LIMIT_PER_MIN:-600}
      AUTH_RATE_LIMIT_PER_MIN: ${AUTH_RATE_LIMIT_PER_MIN:-10}
      WEB_URL: http://web:80
      APP_URL: ${APP_URL:-http://localhost:8080}
      SMTP_URL: ${SMTP_URL:-}
      EMAIL_FROM: ${EMAIL_FROM:-}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_PUBLISHABLE_KEY: ${STRIPE_PUBLISHABLE_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      # Fabricating a result when the real integration is absent: settling a
      # buyer payment with no card processor, and returning the built-in worked
      # example from Auto-Appraisal with no AI key. Off unless a demo instance
      # asks for it — see the note in infra/DEPLOY.md.
      DEMO_MODE: ${DEMO_MODE:-}
      # Map tiles. infra/DEPLOY.md tells an operator to set these — under a
      # heading saying the choice has to be made before selling this — and they
      # were never passed to the container, so setting them did nothing at all
      # and the stack carried on hitting tile.openstreetmap.org under a default
      # User-Agent. See the OSM tile usage policy note in that runbook.
      TILE_URL: ${TILE_URL:-}
      TILE_ATTRIBUTION: ${TILE_ATTRIBUTION:-}
      TILE_USER_AGENT: ${TILE_USER_AGENT:-}
      # Google Static Maps. Both are read SERVER-side and never reach a browser;
      # without the key the app falls back to the tile map, which is what the
      # public demo and CI run on. Restrict the key by IP (this server), not by
      # HTTP referrer — nothing referring to it is a browser.
      GOOGLE_MAPS_API_KEY: ${GOOGLE_MAPS_API_KEY:-}
      GOOGLE_MAPS_SIGNING_SECRET: ${GOOGLE_MAPS_SIGNING_SECRET:-}
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      # loopback only: nginx on :8080 is the front door, and it is where the
      # security headers and the tile and download routes are enforced. A
      # published 4100 is a way around all of it. Still reachable from the host
      # for the manual verification in docs/COMPLIANCE.md.
      - '127.0.0.1:4100:4100'
    healthcheck:
      # /ready, not /health: liveness answers "the process is up", which a
      # container that cannot reach its database also answers. node, not curl,
      # because the image has node and does not have curl.
      test: ['CMD', 'node', '-e', "require('http').get('http://127.0.0.1:4100/ready',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s
    volumes:
      - uploads:/app/apps/api/uploads

  web:
    build:
      context: .
      dockerfile: infra/web.Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        # nginx resolves `api` once at startup and caches it; bringing the front
        # door up before the thing behind it means the first visitors get a 502
        # from a proxy that has given up looking.
        condition: service_healthy
    ports:
      - '8080:80'

volumes:
  pgdata:
  uploads:
