name: CI

# kept/ is excluded on both events. It is a separate product in this
# repository — its own npm project, outside the pnpm-workspace globs, sharing
# no dependency with Apex Appraise — and it has its own workflow
# (.github/workflows/kept.yml), which is scoped to kept/** for the mirror
# reason. Without this, a commit to kept ran a full pnpm install, a Prisma
# generate, a Postgres service and a Playwright browser job to prove nothing:
# green every time, on a diff that could not reach any of it. kept.yml's own
# header claimed this separation already existed in both directions; it did
# not, and this is the half that was missing.
#
# Note what a path filter does NOT do, because it is easy to expect more of it:
# on `pull_request` GitHub evaluates it against the PULL REQUEST'S WHOLE DIFF,
# not the commit that was just pushed. A pull request that touches one file
# outside kept/ — this workflow, say — runs this suite on every later commit,
# whatever those commits touch. Measured on the pull request that introduced
# this line, which still runs the full Apex suite for exactly that reason. The
# saving is on pushes to main and on pull requests confined to kept/. The same
# caveat applies to kept.yml's `paths:` in the other direction.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['kept/**']
  pull_request:
    paths-ignore: ['kept/**']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Engine golden tests
        run: pnpm --filter @apex/appraisal-engine test
      - name: Generate Prisma client (sqlite dev schema)
        run: pnpm --filter @apex/api prisma:generate
      - name: Typecheck API
        run: pnpm --filter @apex/api build
      - name: API tests (tenant isolation)
        run: pnpm --filter @apex/api test
      - name: Typecheck web
        run: pnpm --filter @apex/web lint
      # The heavy dependencies must arrive on demand, not with the screen. A
      # static import does not fail the build — it just moves a megabyte into a
      # route chunk, and the person who pays is a valuer on a site with no
      # signal. Checked against what Rollup actually emitted.
      - name: Build the web app and check what each screen costs
        run: pnpm --filter @apex/web build && pnpm --filter @apex/web check:bundle

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine # must match production; see docs/DATABASE.md
        env:
          POSTGRES_USER: apex
          POSTGRES_PASSWORD: apex
          POSTGRES_DB: apex
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U apex"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Rewrite datasource to postgres (same seds as the Docker image)
        run: |
          sed -i 's/provider = "sqlite"/provider = "postgresql"/' apps/api/prisma/schema.prisma
          sed -i 's|url      = "file:./dev.db"|url      = env("DATABASE_URL")|' apps/api/prisma/schema.prisma
      - name: Apply migrations + seed against Postgres
        env:
          DATABASE_URL: postgresql://apex:apex@localhost:5432/apex
        run: |
          cd apps/api
          # the same command production boots with, against an EMPTY database:
          # this is what proves the committed migrations can actually build the
          # schema from nothing, which `db push` never checked
          npx prisma migrate deploy
          npx prisma generate
          npx tsx prisma/seed.ts
      - name: Schema and migrations agree
        env:
          DATABASE_URL: postgresql://apex:apex@localhost:5432/apex
        run: |
          cd apps/api
          # a schema edit without a migration is the failure this catches: the
          # models would drift ahead of the SQL and prod would boot the old shape
          npx prisma migrate diff \
            --from-url "$DATABASE_URL" \
            --to-schema-datamodel prisma/schema.prisma \
            --exit-code && echo "in sync" || {
              echo "::error::schema.prisma has changes with no migration — run the baseline procedure in docs/DATABASE.md"
              exit 1
            }

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Job-level, not step-level. compose interpolates the whole file for EVERY
    # command, so `docker compose logs` needs these as much as `up` does — and
    # that is the step that runs when the suite has just failed. It was set on
    # `up` alone, so the one time the diagnostics mattered they died with
    # "required variable POSTGRES_PASSWORD is missing" instead of printing the
    # API log.
    env:
      # a throwaway signing key: this stack is created and destroyed inside
      # this job, and no real secret should ever be needed to run the tests
      JWT_SECRET: ci-ephemeral-not-a-real-secret
      # a throwaway database password, for the same reason as the signing key
      POSTGRES_PASSWORD: ci-ephemeral-not-a-real-password
      # the suite signs in as the seeded demo users, so this stack asks for
      # them explicitly — a production build does not seed them
      SEED_DEMO: '1'
      # …and it drives the demo fallbacks too: the suite asserts that
      # Auto-Appraisal returns the worked example AND says so. A production
      # deployment refuses to invent a scheme; this stack is a demo and has to
      # declare itself one. See src/demo-mode.ts.
      DEMO_MODE: '1'
      # The suite signs in on every test from one IP, so the honest
      # production limits would fail it for the wrong reason. They live HERE
      # rather than in docker-compose.yml, so the file people deploy is not
      # loosened to suit the test run. The limiter itself is covered
      # directly by apps/api/test/security.test.ts.
      RATE_LIMIT_PER_MIN: '5000'
      AUTH_RATE_LIMIT_PER_MIN: '1000'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install
      - name: Build and start the production stack
        run: |
          # --env-file /dev/null so a stray .env can never leak real credentials
          # into a CI run, and so the suite is proven to pass WITHOUT them
          docker compose --env-file /dev/null up -d --build
      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://localhost:8080/ > /dev/null 2>&1; then echo "up after ${i}s"; exit 0; fi
            sleep 1
          done
          echo "::error::the stack never came up"
          docker compose logs --tail 60
          exit 1
      - name: Install browsers
        run: pnpm --filter @apex/web exec playwright install --with-deps chromium
      - name: Browser suite against the built stack
        env:
          E2E_BASE_URL: http://localhost:8080
        run: pnpm --filter @apex/web exec playwright test
      - name: API logs on failure
        if: failure()
        run: docker compose logs --tail 120 api
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
          retention-days: 7
