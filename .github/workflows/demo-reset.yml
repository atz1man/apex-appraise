name: Demo reset

# Wipe + reseed of the public demo org so the live demo at
# apex-appraise-web.fly.dev always looks pristine. Goes through the web nginx
# proxy (the api app is flycast-only). Requires the DEMO_RESET_TOKEN repo
# secret to match the api app's RESET_TOKEN.
# Manual only. It used to run nightly, which is right for a demo nobody is
# mid-way through and wrong the moment somebody is testing it: a tester's
# afternoon of work disappeared at 03:00 with nothing to say why. Run it from
# the Actions tab between sessions instead, or on a schedule again once no
# named tester is working in the instance.
on:
  workflow_dispatch:

jobs:
  reset:
    runs-on: ubuntu-latest
    steps:
      - name: Reset the demo org
        run: >-
          curl -fsS -X POST https://apex-appraise-web.fly.dev/admin/reset-demo
          -H "x-reset-token: ${{ secrets.DEMO_RESET_TOKEN }}"
