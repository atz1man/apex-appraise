# The client's real IP, forwarded to the API.
#
# Without this the API sees THIS machine's address for every browser request, so
# any per-IP rate limit shares one bucket across the entire user base: one busy
# firm locks out everybody, and an attacker looks exactly like normal load.
#
# Fly stamps Fly-Client-IP at its edge; $remote_addr here is Fly's proxy, not the
# user, so it is the incoming header that matters — not anything nginx observes.
proxy_set_header Fly-Client-IP $http_fly_client_ip;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
