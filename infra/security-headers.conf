# Security response headers, included rather than set once.
#
# WHY A SNIPPET. `add_header` in a location REPLACES the inherited set rather
# than adding to it, so a server-level block of security headers is silently
# dropped by every location that sets a header of its own — and five here do,
# all for `Cache-Control`: `/assets/` (the JavaScript bundle), `/fonts/`, the
# image regex, `/ready`, and `location /` (the SPA entry itself). Setting these
# once at the top would have protected every path except the document and the
# script, which are the two that matter. So they live here and are included
# wherever a header is set, the way `client-ip.conf` already is.
# `apps/api/test/security-headers.test.ts` holds that rule: a location that sets
# its own header and does not include this file fails the build naming itself.
#
# `always` on every line: without it nginx omits the header on 4xx and 5xx, so
# an error page would be the one response served without them.

# Content sniffing is how a text/plain upload becomes an executable script.
add_header X-Content-Type-Options "nosniff" always;

# Referrers leak a deal id into another site's logs. Same-origin keeps the full
# path; cross-origin sends the origin only, and nothing at all to plain HTTP.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Nothing in this product is meant to be framed, and `frame-ancestors` below
# says so to modern browsers. This is the older header that still covers the
# ones that ignore it. The app frames Stripe, which this does not affect: it
# governs who may frame US.
add_header X-Frame-Options "DENY" always;

# HSTS only over TLS, which is why it is a variable rather than a literal.
#
# Fly terminates TLS and forwards `X-Forwarded-Proto: https`; the compose stack
# publishes :8080 over plain HTTP. HSTS applies to the HOST and ignores the
# port, so emitting it unconditionally would pin a self-hoster's host — or
# `localhost` during a local run — to HTTPS in the browser's preload state and
# lock them out of a stack that serves none. nginx omits a header whose value is
# empty, so the guard costs nothing where it does not apply.
set $apex_hsts "";
if ($http_x_forwarded_proto = "https") {
  set $apex_hsts "max-age=31536000; includeSubDomains";
}
add_header Strict-Transport-Security $apex_hsts always;

# The policy, REPORT-ONLY — observing, not enforcing, and deliberately so.
#
# Everything this product loads is its own: the typefaces, the icons, the map
# tiles and the Google static map are all served from here, and
# `e2e/third-party.spec.ts` fails the build if a page contacts anyone else. The
# one exception is Stripe's payment form, which must see a card number:
# `StripePaymentModal` calls `loadStripe`, which INJECTS a script from
# js.stripe.com at runtime, mounts Elements in Stripe's own iframes and posts
# the card to api.stripe.com. That is why the allowances below exist.
#
# It does not enforce yet because it has not been verified against the built
# stack, and the one path a wrong policy would break is that modal — real card
# payments, on a flow no spec in the suite opens, precisely because a card
# number should reach Stripe and never us. Enforcing a policy whose only
# untested clause is the one handling money is the wrong way round. Serve this,
# watch a real deployment report nothing, then drop `-Report-Only` from the
# directive name: that is the whole of the change.
#
# `style-src` needs 'unsafe-inline' and will keep needing it: this app styles
# through `style={{…}}` attributes in hundreds of places, and an inline style
# attribute is inline style. 'unsafe-inline' on STYLE is not the hazard the
# name suggests — the serious one is script, which is not granted.
add_header Content-Security-Policy-Report-Only "default-src 'self'; script-src 'self' https://js.stripe.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self' https://api.stripe.com; frame-src 'self' https://js.stripe.com; worker-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'; object-src 'none'" always;
