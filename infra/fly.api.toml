# Fly.io config — API. Deploy from the repo root:
#   flyctl deploy -c infra/fly.api.toml
#
# The API is private: it has no public IPs, only a flycast address the web
# app's nginx proxies to (release public IPs after first deploy if any were
# allocated: `flyctl ips release <ip> -a apex-appraise-api`).
#
# Required secrets (flyctl secrets set -a apex-appraise-api ...):
#   DATABASE_URL   — set automatically by `flyctl postgres attach`
#   JWT_SECRET     — openssl rand -hex 32
# Optional: ANTHROPIC_API_KEY, EPC_BEARER_TOKEN, STRIPE_SECRET_KEY,
#   STRIPE_PUBLISHABLE_KEY, STRIPE_WEBHOOK_SECRET, SMTP_URL, EMAIL_FROM
#
# Optional, and the pair that decides what the MAPS look like:
#   GOOGLE_MAPS_API_KEY        — Static Maps API, restricted BY IP, not by HTTP
#                                referrer: the requests come from this server,
#                                and nothing referring to the key is a browser
#   GOOGLE_MAPS_SIGNING_SECRET — the URL signing secret from the same console
#
# With neither set — which is how this app runs today — `/staticmap` answers
# 404, `org.mapConfig` advertises `staticMapUrl: null`, and every map in the
# product falls back to the OpenStreetMap tile renderer. That fallback is the
# DEFAULT path rather than the unhappy one (the public demo has no Google
# account and CI has no key, so it is the path the whole browser suite
# exercises), which is exactly why its absence here was easy to miss: nothing
# looks broken, the maps are simply not Google's.
#
# Setting either secret restarts the app with the new environment. That is NOT
# the same as shipping code, and the difference cost an afternoon: this repo has
# no CD (`ci.yml` runs the tests and stops), so the machine can be running an
# image built weeks before the feature the secret is for. `fly secrets set` then
# succeeds, the machine restarts, the key is genuinely present — and the maps do
# not change, because the running build has no `/staticmap` route to serve and a
# `mapConfig` that has never heard of `staticMapUrl`. There is nothing in the
# logs to say so; the browser simply never asks.
#
# So check what is actually running before concluding a secret did not take:
#
#   fly status -a apex-appraise-api      # the Image line, and when it was built
#   fly deploy -c infra/fly.api.toml     # if it predates the feature
#
# Both keys stay server-side; neither reaches a browser.

app = "apex-appraise-api"
primary_region = "lhr"

# dockerfile resolves relative to THIS file; build context is the cwd flyctl
# runs from (the repo root)
[build]
  dockerfile = "api.Dockerfile"

[env]
  NODE_ENV = "production"
  PORT = "4100"
  # public URL used in email links; flip to the custom domain when one exists
  APP_URL = "https://apex-appraise-web.fly.dev"
  # server-side PDF renderer loads the web app; the public host has a cert,
  # flycast does not (web's force_https would 301 flycast HTTP into a dead end)
  WEB_URL = "https://apex-appraise-web.fly.dev"

[http_service]
  internal_port = 4100
  # flycast-only: force_https would 301 internal HTTP calls from nginx
  force_https = false
  auto_stop_machines = "stop"
  auto_start_machines = true
  # login throttling and Stripe webhooks want a warm machine
  min_machines_running = 1

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    # first boot applies migrations
    grace_period = "90s"
    method = "GET"
    # /ready, not /health. /health answers 200 while the process is alive, which
    # is also true of a process that cannot reach Postgres and is failing every
    # request — Fly would have kept that machine in rotation. /ready checks the
    # database and returns 503 when it cannot, so an unreachable database takes
    # the machine out instead of quietly serving errors.
    path = "/ready"

[[mounts]]
  source = "uploads"
  destination = "/app/apps/api/uploads"
  initial_size = "3gb"

[[vm]]
  size = "shared-cpu-1x"
  memory = "1gb"
