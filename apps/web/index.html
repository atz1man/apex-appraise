    <!-- Typefaces are served by this app, not by Google: a signed valuation must
         not depend on a third party being reachable at render time, the offline
         field app cannot cache a cross-origin font, and the privacy notice says
         "Nobody else." Preloaded so first paint uses the intended face rather
         than swapping into it. @font-face lives in src/index.css. -->
    <link rel="preload" href="/fonts/schibsted-grotesk-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/jetbrains-mono-latin.woff2" as="font" type="font/woff2" crossorigin />
